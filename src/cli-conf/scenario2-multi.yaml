# This files contains the configuration to reproduce the scenario 1 of the Snkf paper.

defaults:
  - base_config
  - handlers:
    - activation-block
  - sampler:
    - stack-of-spiral
  - reconstructors:
      - cg
  - _self_

cache_dir: ${oc.env:PWD}/results
result_dir: ${oc.env:PWD}/results
filename:  ${result_dir}/scenario2_${engine.model}_${engine.snr}_${sampler.stack-of-spiral.constant}_${sampler.stack-of-spiral.accelz}.mrd

sim_conf:
  max_sim_time: 2
  seq: {TR: 50, TE: 25, FA: 15}
  hardware:
    n_coils: 8
    dwell_time_ms: 0.002
  fov:
    res_mm: [3, 3, 3]
    size: [192.0, 192.0, 120.0]

phantom:
  name: brainweb
  sub_id: 44
  tissue_file: "tissue_7T"

handlers:
  activation-block:
    event_name: block_on
    block_on: 20 # seconds
    block_off: 20 #seconds
    duration: 300 # seconds
    delta_r2s: 1000 # millisecond^-1

sampler:
  stack-of-spiral:
    acsz: 18
    accelz: 3
    nb_revolutions: 16
    constant: true
    orderz: "top-down"
    spiral_name: "archimedes"
    pdfz: "uniform"
    obs_time_ms: 30

engine:
  n_jobs: 5
  chunk_size: 180
  model: "simple"
  snr: 10000
  nufft_backend: "stacked-gpunufft"

reconstructors:
  cg:
      nufft_backend: "cufinufft"
      density_compensation: False
      restart_strategy: COLD
      max_iter: 15
      tol: 2e-6


hydra:
  job:
    chdir: true

  run:
    dir: ${result_dir}/outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${result_dir}/multirun/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  callbacks:
    # gather_files:
    #   _target_: hydra_callbacks.MultiRunGatherer
    #   aggregator:
    #     _partial_: true
    #     _target_: snkf.cli.utils.aggregate_results

    log_job:
      _target_: hydra.experimental.callbacks.LogJobReturnCallback
    latest_run:
      _target_: hydra_callbacks.LatestRunLink
      run_base_dir:  ${result_dir}/outputs
      multirun_base_dir:  ${result_dir}/multirun
